<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - My Camera Showcase</title>
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Poppins', sans-serif; background: #000; color: #fff; }
    nav {
      background: rgba(0, 0, 0, 0.9);
      padding: 15px; text-align: center; position: sticky; top: 0; z-index: 10;
    }
    nav a {
      color: #fff; margin: 0 15px; text-decoration: none; font-weight: 600;
      transition: color 0.3s;
    }
    nav a:hover { color: #ff9500; }
    .content {
      max-width: 400px; margin: 60px auto; padding: 30px;
      background: rgba(255, 255, 255, 0.1); border-radius: 20px; text-align: center;
    }
    input {
      width: 100%; padding: 12px; margin: 12px 0;
      border-radius: 10px; border: none; font-size: 15px;
    }
    button {
      background: #ff9500; border: none; color: #fff; padding: 12px 20px;
      font-weight: bold; border-radius: 10px; cursor: pointer; transition: 0.3s;
    }
    button:hover { background: #e68900; }
    footer {
      background: rgba(43, 42, 42, 0.85);
      text-align: center; padding: 20px; margin-top: 345px;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <nav>
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a href="contact.html">Contact</a>
    <a href="login.html">Login</a>
    <a href="register.html">Register</a>
  </nav>

  <div class="content">
    <h1>Create Account</h1>
    <form>
      <input type="text" placeholder="Full Name" required>
      <input type="email" placeholder="Email" required>
      <input type="password" placeholder="Password" required>
      <input type="password" placeholder="Confirm Password" required>
      <button type="submit">Register</button>
    </form>
  </div>

  <footer>
    <p>&copy; 2025 My Camera Showcase. All rights reserved.</p>
  </footer>
</body>
</html>
